<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Markerless AR Experience — Tap to Place & Inspect</title>
    <!-- Google Model Viewer (Official WebXR, Apple ARKit Quick Look & Android Scene Viewer) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: radial-gradient(circle at 50% 30%, #0d1b3e 0%, #050b18 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 3D Model Viewer Canvas */
        model-viewer {
            flex: 1;
            width: 100%;
            height: 100%;
            --poster-color: transparent;
            outline: none;
        }

        /* Top HUD Bar */
        header {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            pointer-events: none;
        }
        .hud-badge {
            background: rgba(10, 20, 50, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 8px 14px;
            border-radius: 20px;
            color: #00d4ff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
            pointer-events: auto;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00e696;
            box-shadow: 0 0 10px #00e696;
        }

        /* Model Switcher */
        .model-selector {
            background: rgba(10, 20, 50, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 24px;
            display: flex;
            padding: 4px;
            gap: 4px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }
        .selector-btn {
            background: transparent;
            border: none;
            color: #bcd;
            padding: 7px 15px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .selector-btn.active {
            background: linear-gradient(135deg, #00d4ff, #387aff);
            color: #050b1e;
            font-weight: 800;
            box-shadow: 0 2px 14px rgba(0, 212, 255, 0.4);
        }

        /* Floating Academic Tag */
        .academic-tag {
            position: absolute;
            top: 68px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 14, 38, 0.82);
            border: 1px solid rgba(0, 212, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            color: #ccddee;
            text-align: center;
            pointer-events: none;
            z-index: 25;
            white-space: nowrap;
        }
        .academic-tag span {
            color: #00d4ff;
            font-weight: 700;
        }

        /* Bottom Controls Container */
        .bottom-container {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 30;
            padding: 0 16px;
            pointer-events: none;
        }

        /* Animation Action Chips (For Robot) */
        #anim-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(8, 16, 42, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 6px 12px;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            pointer-events: auto;
            max-width: 95%;
        }
        .anim-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 6px 13px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .anim-chip:active, .anim-chip.active {
            background: #00d4ff;
            color: #050b1e;
            border-color: #00d4ff;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
            font-weight: 800;
        }

        /* Big Glowing AR Activation Button */
        #ar-button {
            background: linear-gradient(135deg, #00d4ff 0%, #387aff 100%);
            border-radius: 35px;
            border: none;
            padding: 16px 34px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #050b1e;
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #ar-button:active {
            transform: scale(0.96);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        /* Instructions Hint */
        .touch-hint {
            font-size: 11px;
            color: #89a;
            letter-spacing: 0.5px;
            text-align: center;
            pointer-events: none;
        }

        /* Link to Marker-based mode */
        .marker-link {
            font-size: 10.5px;
            color: #567;
            text-decoration: underline;
            cursor: pointer;
            pointer-events: auto;
            margin-top: 2px;
        }
        .marker-link:hover { color: #00d4ff; }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <header>
        <div class="hud-badge">
            <div class="status-dot"></div>
            <span>MARKERLESS SLAM AR</span>
        </div>

        <div class="model-selector">
            <button class="selector-btn active" id="btn-robot" onclick="setModel('robot')">🤖 Cyber Robot</button>
            <button class="selector-btn" id="btn-astro" onclick="setModel('astro')">🧑‍🚀 Astronaut</button>
        </div>
    </header>

    <!-- Academic Banner -->
    <div class="academic-tag">
        <span>Surface Detection:</span> Tap button below to place 3D model in your room
    </div>

    <!-- Google Model Viewer (Markerless True AR Component) -->
    <model-viewer
        id="viewer"
        src="robot.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        auto-rotate-delay="1500"
        rotation-per-second="20deg"
        shadow-intensity="1.6"
        shadow-softness="0.8"
        environment-image="neutral"
        exposure="1.15"
        autoplay
        animation-name="Dance"
    >
        <!-- AR Launch Button -->
        <button slot="ar-button" id="ar-button" onclick="playBeep()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                <path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/>
                <circle cx="12" cy="12" r="3.2"/>
            </svg>
            VIEW IN YOUR ROOM (AR)
        </button>
    </model-viewer>

    <!-- Bottom Controls & Action Chips -->
    <div class="bottom-container">
        <!-- Animation Chips for Robot -->
        <div id="anim-bar">
            <button class="anim-chip active" onclick="setAnim('Dance')">💃 Dance</button>
            <button class="anim-chip" onclick="setAnim('Jump')">🦘 Jump</button>
            <button class="anim-chip" onclick="setAnim('Wave')">👋 Wave</button>
            <button class="anim-chip" onclick="setAnim('ThumbsUp')">👍 Thumbs Up</button>
            <button class="anim-chip" onclick="setAnim('Running')">🏃 Run</button>
            <button class="anim-chip" onclick="setAnim('Punch')">🥊 Punch</button>
        </div>

        <div class="touch-hint">
            Drag to rotate &bull; Pinch to zoom in / out &bull; Tap button for room camera
        </div>

        <a class="marker-link" href="marker_ar.html">Prefer paper marker tracking? Open Marker AR</a>
    </div>

    <script>
        // Simple Web Audio Tone Generator for UI feedback
        let audioCtx = null;
        function playBeep() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } catch(e) {}
        }

        const viewer = document.getElementById('viewer');
        const animBar = document.getElementById('anim-bar');

        function setModel(type) {
            playBeep();
            document.querySelectorAll('.selector-btn').forEach(b => b.classList.remove('active'));

            if (type === 'robot') {
                viewer.src = 'robot.glb';
                viewer.setAttribute('animation-name', 'Dance');
                animBar.style.display = 'flex';
                document.getElementById('btn-robot').classList.add('active');
            } else {
                viewer.src = 'astronaut.glb';
                viewer.removeAttribute('animation-name');
                animBar.style.display = 'none';
                document.getElementById('btn-astro').classList.add('active');
            }
        }

        function setAnim(clipName) {
            playBeep();
            viewer.animationName = clipName;
            document.querySelectorAll('.anim-chip').forEach(c => c.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }
    </script>
</body>
</html>
