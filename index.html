<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Augmented Reality Experience — Master's Degree</title>
    <!-- Google Model Viewer (Official WebXR, Apple ARKit Quick Look & Android Scene Viewer) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: radial-gradient(circle at 50% 30%, #0d1b3e 0%, #050b18 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 3D Model Viewer Canvas */
        model-viewer {
            flex: 1;
            width: 100%;
            height: 100%;
            --poster-color: transparent;
            outline: none;
        }

        /* Top Bar: Clean Model Switcher */
        header {
            position: absolute;
            top: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 30;
            padding: 0 16px;
        }
        .model-selector {
            background: rgba(10, 20, 50, 0.88);
            border: 1px solid rgba(0, 212, 255, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            display: flex;
            padding: 4px;
            gap: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        .selector-btn {
            background: transparent;
            border: none;
            color: #b0c4de;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .selector-btn.active {
            background: linear-gradient(135deg, #00d4ff, #387aff);
            color: #050b1e;
            font-weight: 800;
            box-shadow: 0 2px 14px rgba(0, 212, 255, 0.4);
        }

        /* Clean, Small, Perfectly Placed AR Button */
        #ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #00d4ff 0%, #387aff 100%);
            border-radius: 28px;
            border: none;
            padding: 13px 28px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #050b1e;
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.45);
            cursor: pointer;
            display: flex !important;
            align-items: center;
            gap: 8px;
            z-index: 999;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }
        #ar-button:active {
            transform: translateX(-50%) scale(0.96);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        /* Subtle touch gesture hint */
        .hint-text {
            position: absolute;
            bottom: 78px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: #7890a8;
            letter-spacing: 0.3px;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- Clean Top Model Switcher -->
    <header>
        <div class="model-selector">
            <button class="selector-btn active" id="btn-robot" onclick="switchModel('robot')">🤖 Cyber Robot</button>
            <button class="selector-btn" id="btn-screen" onclick="switchModel('screen')">🥽 Vision Pro Screen</button>
            <button class="selector-btn" id="btn-astro" onclick="switchModel('astro')">🧑‍🚀 Astronaut</button>
        </div>
    </header>

    <!-- Subtle Gesture Hint -->
    <div class="hint-text" id="hint-text">
        Drag to rotate &bull; Pinch to zoom &bull; Tap AR to place in room
    </div>

    <!-- Google Model Viewer (Markerless True AR) -->
    <!-- Google Model Viewer (Markerless True AR) -->
    <!-- Exact same robot.glb used in both preview and AR mode -->
    <model-viewer
        id="viewer"
        src="robot.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        auto-rotate-delay="1500"
        rotation-per-second="20deg"
        shadow-intensity="1.5"
        shadow-softness="0.8"
        environment-image="neutral"
        exposure="1.15"
        autoplay
    >
        <!-- Internal slot kept for fallback -->
        <button slot="ar-button" id="hidden-slot-btn" style="display:none;"></button>
    </model-viewer>

    <!-- Always Visible, Small, High-Z-Index AR Button -->
    <button id="ar-button" onclick="launchAR()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/>
            <circle cx="12" cy="12" r="3.2"/>
        </svg>
        <span>VIEW IN AR</span>
    </button>

    <script>
        const viewer = document.getElementById('viewer');
        const hintText = document.getElementById('hint-text');

        function launchAR() {
            // Check if viewer has activateAR method
            if (viewer && typeof viewer.activateAR === 'function') {
                viewer.activateAR();
            } else {
                // Trigger internal slot button
                const slotBtn = document.getElementById('hidden-slot-btn');
                if (slotBtn) slotBtn.click();
            }
        }

        function switchModel(type) {
            document.querySelectorAll('.selector-btn').forEach(b => b.classList.remove('active'));

            if (type === 'robot') {
                viewer.src = 'robot.glb';
                viewer.removeAttribute('ios-src'); // Ensures exact same robot in UI and AR
                document.getElementById('btn-robot').classList.add('active');
                hintText.innerHTML = 'Drag to rotate &bull; Pinch to zoom &bull; Tap AR to place in room';
            } else if (type === 'screen') {
                viewer.src = 'vision_screen.glb';
                viewer.removeAttribute('ios-src');
                document.getElementById('btn-screen').classList.add('active');
                hintText.innerHTML = 'Vision Pro Spatial Display &bull; Walk around screen 360° in AR';
            } else if (type === 'astro') {
                viewer.src = 'astronaut.glb';
                viewer.removeAttribute('ios-src');
                document.getElementById('btn-astro').classList.add('active');
                hintText.innerHTML = 'NASA Apollo Space Suit &bull; Tap AR to inspect up close';
            }
        }
    </script>
</body>
</html>
