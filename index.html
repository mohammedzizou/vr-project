<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Solar System Demo</title>
    <!-- A-Frame library for 3D rendering -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js for augmented reality -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        /* Hide the video feed info message */
        .a-enter-vr { display: none !important; }
        
        /* Loading overlay */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 10, 30, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            transition: opacity 0.5s;
        }
        #loading-overlay h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #00d4ff;
        }
        #loading-overlay p {
            font-size: 1em;
            opacity: 0.8;
            text-align: center;
            padding: 0 20px;
            line-height: 1.6;
        }
        #loading-overlay .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(0,212,255,0.2);
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Loading screen -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <h1>🌍 AR Solar System</h1>
        <p>Loading camera...<br>
           Point your camera at the <strong>Hiro marker</strong><br>
           to see the solar system appear!</p>
    </div>

    <!-- AR Scene -->
    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true; antialias: true;"
        vr-mode-ui="enabled: false"
    >
        <!-- AR Marker (Hiro - standard marker) -->
        <a-marker preset="hiro">

            <!-- ☀️ Sun - center -->
            <a-sphere
                position="0 0.5 0"
                radius="0.3"
                color="#FDB813"
                material="emissive: #FDB813; emissiveIntensity: 0.8"
            >
                <a-animation
                    attribute="rotation"
                    dur="10000"
                    to="0 360 0"
                    repeat="indefinite"
                    easing="linear"
                ></a-animation>
            </a-sphere>

            <!-- 🪨 Mercury - orbit 1 -->
            <a-entity
                position="0 0.5 0"
            >
                <a-animation
                    attribute="rotation"
                    dur="4000"
                    to="0 360 0"
                    repeat="indefinite"
                    easing="linear"
                ></a-animation>
                <a-sphere
                    position="0.5 0 0"
                    radius="0.04"
                    color="#A0522D"
                ></a-sphere>
            </a-entity>

            <!-- 🌕 Venus - orbit 2 -->
            <a-entity
                position="0 0.5 0"
            >
                <a-animation
                    attribute="rotation"
                    dur="6500"
                    to="0 360 0"
                    repeat="indefinite"
                    easing="linear"
                ></a-animation>
                <a-sphere
                    position="0.7 0 0"
                    radius="0.06"
                    color="#DEB887"
                ></a-sphere>
            </a-entity>

            <!-- 🌍 Earth - orbit 3 -->
            <a-entity
                position="0 0.5 0"
            >
                <a-animation
                    attribute="rotation"
                    dur="8000"
                    to="0 360 0"
                    repeat="indefinite"
                    easing="linear"
                ></a-animation>
                <a-sphere
                    position="0.95 0 0"
                    radius="0.07"
                    color="#4169E1"
                >
                    <!-- 🌙 Moon orbiting Earth -->
                    <a-entity>
                        <a-animation
                            attribute="rotation"
                            dur="3000"
                            to="0 360 0"
                            repeat="indefinite"
                            easing="linear"
                        ></a-animation>
                        <a-sphere
                            position="0.12 0 0"
                            radius="0.02"
                            color="#C0C0C0"
                        ></a-sphere>
                    </a-entity>
                </a-sphere>
            </a-entity>

            <!-- 🔴 Mars - orbit 4 -->
            <a-entity
                position="0 0.5 0"
            >
                <a-animation
                    attribute="rotation"
                    dur="11000"
                    to="0 360 0"
                    repeat="indefinite"
                    easing="linear"
                ></a-animation>
                <a-sphere
                    position="1.2 0 0"
                    radius="0.055"
                    color="#CD5C5C"
                ></a-sphere>
            </a-entity>

            <!-- 🟠 Jupiter - orbit 5 -->
            <a-entity
                position="0 0.5 0"
            >
                <a-animation
                    attribute="rotation"
                    dur="16000"
                    to="0 360 0"
                    repeat="indefinite"
                    easing="linear"
                ></a-animation>
                <a-sphere
                    position="1.55 0 0"
                    radius="0.15"
                    color="#DAA520"
                ></a-sphere>
            </a-entity>

            <!-- 🪐 Saturn - orbit 6 (with ring) -->
            <a-entity
                position="0 0.5 0"
            >
                <a-animation
                    attribute="rotation"
                    dur="20000"
                    to="0 360 0"
                    repeat="indefinite"
                    easing="linear"
                ></a-animation>
                <a-entity position="1.9 0 0">
                    <a-sphere
                        radius="0.12"
                        color="#F4A460"
                    ></a-sphere>
                    <!-- Saturn's ring -->
                    <a-torus
                        radius="0.2"
                        radius-tubular="0.01"
                        rotation="90 0 0"
                        color="#D2B48C"
                        material="opacity: 0.6; transparent: true"
                    ></a-torus>
                </a-entity>
            </a-entity>

            <!-- 💎 Uranus - orbit 7 -->
            <a-entity
                position="0 0.5 0"
            >
                <a-animation
                    attribute="rotation"
                    dur="25000"
                    to="0 360 0"
                    repeat="indefinite"
                    easing="linear"
                ></a-animation>
                <a-sphere
                    position="2.2 0 0"
                    radius="0.09"
                    color="#87CEEB"
                ></a-sphere>
            </a-entity>

            <!-- 🔵 Neptune - orbit 8 -->
            <a-entity
                position="0 0.5 0"
            >
                <a-animation
                    attribute="rotation"
                    dur="30000"
                    to="0 360 0"
                    repeat="indefinite"
                    easing="linear"
                ></a-animation>
                <a-sphere
                    position="2.5 0 0"
                    radius="0.085"
                    color="#4682B4"
                ></a-sphere>
            </a-entity>

            <!-- Ambient light -->
            <a-light type="ambient" color="#444"></a-light>

            <!-- Point light from the Sun -->
            <a-light
                type="point"
                position="0 0.5 0"
                intensity="1.5"
                color="#FDB813"
                distance="5"
            ></a-light>

        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Hide loading overlay once camera is ready
        const scene = document.querySelector('a-scene');
        scene.addEventListener('loaded', function () {
            setTimeout(function() {
                const overlay = document.getElementById('loading-overlay');
                overlay.style.opacity = '0';
                setTimeout(function() {
                    overlay.style.display = 'none';
                }, 500);
            }, 2000);
        });
    </script>
</body>
</html>
